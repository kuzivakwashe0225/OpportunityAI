services:
  api:
    restart: unless-stopped
    build: .
    command: python -m uvicorn opportunity_agent.api:app --host 0.0.0.0 --port 8000 --forwarded-allow-ips '*'
    ports:
      # Bound to the loopback, not 0.0.0.0. Caddy terminates TLS on
      # opportunityai.meshcloud.co.zw and proxies here; leaving this open to
      # the internet meant every visitor could reach the app over plain HTTP
      # and hand their session cookie to anyone on the path.
      #
      # It is also what makes the rate limiter's view of the caller honest:
      # X-Forwarded-For is forgeable by whoever can talk to the app directly,
      # and after this change nobody can. throttle.client_address() depends on
      # that - changing either one alone breaks it.
      - "127.0.0.1:8000:8000"
    environment:
      # Set now that Caddy terminates TLS in front. Without it the session
      # cookie is sent over plain HTTP too, which is the hole this pair
      # closes.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
      # Tells browsers never to try this host over HTTP again. Deliberately
      # separate from the flag above: this one is hard to undo, so a
      # deployment without TLS must be able to leave it off.
      HSTS_ENABLED: ${HSTS_ENABLED:-1}
      DATABASE_URL: postgresql+psycopg://opportunity:opportunity@db:5432/opportunity_agent
      OPPORTUNITY_AGENT_STORE_PATH: /data/store.json
      # SearXNG (below) is the primary search backend - self-hosted, no
      # per-query cost or plan cap. Tavily is kept as an optional fallback:
      # unset SEARXNG_URL and this reverts to exactly the old behaviour.
      SEARXNG_URL: http://searxng:8080
      SEARCH_CACHE_TTL_MINUTES: ${SEARCH_CACHE_TTL_MINUTES:-360}
      SEARCH_PAUSE_SECONDS: ${SEARCH_PAUSE_SECONDS:-1.0}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SESSION_SECRET_KEY: "${SESSION_SECRET_KEY:?set SESSION_SECRET_KEY in .env, e.g. via python -c 'import secrets, sys; sys.stdout.write(secrets.token_hex(32))'}"
      # Portal credentials (the owner's eGP login) are encrypted with this.
      # Unset is a valid state: the credentials feature refuses to store
      # anything rather than falling back to plaintext, so the rest of the app
      # runs fine without it. Deliberately NOT `:?` for that reason.
      CREDENTIALS_SECRET_KEY: ${CREDENTIALS_SECRET_KEY:-}
      # Sign in with Google. Unset is a valid state - /auth/config reports it
      # as absent and the sign-in page shows the button as not configured
      # rather than broken, the same degrade-not-crash pattern as the two
      # keys above. No secret is needed: the browser proves identity with a
      # token this server verifies for itself (google_auth.py).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Who sees /admin/* - the beta-test monitoring dashboard: who's using
      # this, feedback, and issues the system caught on its own. Comma
      # separated. An account is promoted the moment it next makes an
      # authenticated request whose email matches, so this is a live control
      # - no database edit needed to grant or revoke it.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Outbound mail for new-account passwords. Unset means registration
      # returns 503 rather than creating accounts whose password was never
      # delivered - see mailer.py. Everything else runs fine without it.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      APP_URL: ${APP_URL:-https://opportunityai.meshcloud.co.zw/ui}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-opportunity}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-opportunity-secret}
      # Ollama runs on the host, not in a container (SOLUTION_DEFINITION.md
      # §14/§15) - host.docker.internal + extra_hosts below is the portable
      # way to reach it from inside a Linux Docker Engine container ("localhost"
      # here would mean the container itself, not the host).
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - opportunity-data:/data
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      searxng:
        condition: service_started

  worker:
    restart: unless-stopped
    build: .
    command: python -m opportunity_agent.worker
    environment:
      DATABASE_URL: postgresql+psycopg://opportunity:opportunity@db:5432/opportunity_agent
      OPPORTUNITY_AGENT_STORE_PATH: /data/store.json
      SEARXNG_URL: http://searxng:8080
      SEARCH_CACHE_TTL_MINUTES: ${SEARCH_CACHE_TTL_MINUTES:-360}
      SEARCH_PAUSE_SECONDS: ${SEARCH_PAUSE_SECONDS:-1.0}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      DISCOVERY_INTERVAL_SECONDS: ${DISCOVERY_INTERVAL_SECONDS:-3600}
    volumes:
      - opportunity-data:/data
    depends_on:
      db:
        condition: service_healthy
      searxng:
        condition: service_started

  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opportunity
      POSTGRES_PASSWORD: opportunity
      POSTGRES_DB: opportunity_agent
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opportunity"]
      interval: 5s
      timeout: 5s
      retries: 5

  # No compose-level healthcheck here on purpose: the official minio/minio
  # image's available tooling for one varies by version and wasn't verified
  # against a running container in this pass. api/worker connecting to MinIO
  # before it's fully ready (rare in practice - `depends_on` still enforces
  # start order) should be handled with connection retry in documents.py,
  # which doesn't exist yet - real gap, not silently assumed solved.
  minio:
    restart: unless-stopped
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-opportunity}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-opportunity-secret}
    ports:
      # Loopback only. This bucket holds people's tax clearance certificates,
      # CVs and national IDs, and nothing outside the box has any business
      # reaching it: the API talks to it over the compose network as
      # minio:9000, and presigned URLs are never handed to a browser.
      #
      # It was open to the internet, which made a MinIO vulnerability or a
      # leaked key immediately exploitable by anyone rather than by someone
      # who already had a shell here. Reach the console over an SSH tunnel:
      #   ssh -L 9001:127.0.0.1:9001 isaiah@161.97.176.218
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  # Self-hosted web search - see search.py's search_via_searxng() docstring
  # for why: Tavily's free plan is a hard 1,000 requests/month cap with no
  # pay-as-you-go overage configured, and every profile's discovery cycle can
  # burn up to ten of those per run. SearXNG aggregates other engines instead
  # of billing per query, so there is no plan to run out of - the tradeoff is
  # that heavy use can get *this server's own IP* rate-limited by the
  # upstream engines it queries, which is an operational problem to watch for,
  # not a billing one to be surprised by.
  searxng:
    restart: unless-stopped
    image: searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      # Required by SearXNG's own startup check - a real secret, not the
      # settings.yml placeholder, the same way SESSION_SECRET_KEY works above.
      SEARXNG_SECRET: "${SEARXNG_SECRET:?set SEARXNG_SECRET in .env, e.g. via python -c 'import secrets, sys; sys.stdout.write(secrets.token_hex(32))'}"
      SEARXNG_VALKEY_URL: valkey://valkey:6379/0
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    depends_on:
      - valkey
    # No ports published, deliberately: reached only from inside this compose
    # network, by service name, from api and worker. Publishing it would put
    # an unauthenticated open web-search proxy on the public internet - free
    # anonymous searching for anyone who finds the port, at this server's
    # bandwidth and reputation cost with the upstream engines.

  valkey:
    restart: unless-stopped
    image: valkey/valkey:8-alpine
    command: valkey-server --save "" --appendonly no

volumes:
  opportunity-data:
  postgres-data:
  minio-data:
