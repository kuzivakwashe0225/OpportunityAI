[project]
name = "opportunity-agent"
version = "0.1.0"
description = "Scholarship discovery and matching MVP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
