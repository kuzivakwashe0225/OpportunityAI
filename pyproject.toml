[project]
name = "opportunity-agent"
version = "0.1.0"
description = "OpportunityAI - scholarship, job, and grant discovery and application assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "bcrypt>=4.1,<5",
    "pyjwt>=2.9,<3",
    "minio>=7.2,<8",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
]

[tool.setuptools.package-data]
# api.py reads web/index.html at import time (Path(__file__).parent / "web").
# Non-Python files aren't included in a build by default - only caught because
# the Docker image build does a real, non-editable `pip install .`; local dev
# has been using `pip install -e .` (editable), which points straight at the
# source tree and never exercises the packaging step this depends on.
opportunity_agent = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
