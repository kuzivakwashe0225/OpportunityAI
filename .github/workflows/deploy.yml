name: Test and deploy

# Deploys on every push to master. Tests run first and a failure stops the
# deploy - the whole point of automating this is that a broken commit should
# be harder to ship than a working one, not easier.
on:
  push:
    branches: [master]
  # Lets a deploy be re-run from the Actions tab without an empty commit,
  # which is what you want at 2am when the last one failed on a flake.
  workflow_dispatch:

concurrency:
  # Two deploys racing onto one server leaves it in whichever state finished
  # last, which is not necessarily the newest commit. Queue them instead.
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run the suite
        env:
          # auth.py refuses to run without this; the value is irrelevant to
          # tests, it just must exist. Not a secret - it never signs anything
          # a real user holds.
          SESSION_SECRET_KEY: ci-only-not-a-real-secret
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy secrets are actually set
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # Named individually so a missing one says which, rather than
          # failing later as an ssh error to "@" that means nothing.
          missing=""
          [ -z "$SSH_PRIVATE_KEY" ] && missing="$missing DEPLOY_SSH_KEY"
          [ -z "$SSH_HOST" ] && missing="$missing DEPLOY_HOST"
          [ -z "$SSH_USER" ] && missing="$missing DEPLOY_USER"
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing" >&2
            echo "See .github/workflows/README.md for how to add them." >&2
            exit 1
          fi
          echo "all three secrets present"

      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned on first use rather than disabling host checking outright,
          # so a swapped host key fails the deploy instead of being accepted
          # silently.
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # The remote half lives in its own file and is piped in. It used to
          # be a heredoc here and never ran once: a heredoc terminator must be
          # at column 0, and everything inside `run: |` is indented.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            'bash -s' < .github/scripts/deploy-remote.sh
